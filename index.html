<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FlightChat</title>
<meta name="description" content="Chat with your group on the plane. No internet needed.">
<link rel="icon" href="/icon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
  /* One screen: the icon, the name, one line and the links. Also the site's 404 page (404.html),
     so paths are absolute. Colors match the help and privacy pages. */
  *, *::before, *::after { box-sizing: border-box; }
  :root {
    --bg: #f2f4fa; --surface: #ffffff; --fg: #151a33; --muted: #596079;
    --line: #d9deec; --accent: #4a3ed4;
    --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    --font-body: "Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1023; --surface: #151a33; --fg: #e8ebf7; --muted: #9ba3c0;
      --line: #272d4b; --accent: #a39bff; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1023; --surface: #151a33; --fg: #e8ebf7; --muted: #9ba3c0;
    --line: #272d4b; --accent: #a39bff; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 1.0625rem/1.6 var(--font-body);
    padding: 24px 16px;
    display: grid;
    place-items: center;
  }
  main { max-width: 26rem; width: 100%; display: grid; justify-items: center; gap: 18px; text-align: center; }
  .icon { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 10px 30px rgb(0 0 0 / 0.18); }
  h1 {
    font-family: var(--font-display);
    font-size: clamp(2.2rem, 9vw, 3rem);
    line-height: 1;
    letter-spacing: -0.02em;
    margin: 6px 0 0;
  }
  .tagline { margin: 0; color: var(--muted); font-size: 1.15rem; text-wrap: balance; }
  .lost { margin: 0; padding: 10px 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  nav { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px; margin-top: 8px; }
  a { color: var(--accent); font-weight: 700; text-underline-offset: 3px; }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  footer { color: var(--muted); font-size: 0.9rem; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <img class="icon" src="/icon.png" width="112" height="112" alt="">
  <h1>FlightChat</h1>
  <p class="tagline">Chat with your group on the plane. No internet needed.</p>
  <nav aria-label="FlightChat pages">
    <a href="https://flightchatapp.com/help/">Help</a>
    <a href="https://flightchatapp.com/privacy/">Privacy Policy</a>
    <a href="https://flightchatapp.com/terms/">Terms of Use</a>
  </nav>
  <footer>© 2026 Roni Biran</footer>
</main>
</body>
</html>
